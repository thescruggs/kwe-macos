[workspace]
resolver = "2"
members = [
    "crates/kwe-audio-worker",
    "crates/kwe-cdp",
    "crates/kwe-core",
    "crates/kwe-cli",
    "crates/kwe-daemon",
    "crates/kwe-frame-protocol",
    "crates/kwe-input-protocol",
    "crates/kwe-mpv",
    "crates/kwe-platform",
    "crates/kwe-report-protocol",
    "crates/kwe-scene-inspector",
    "crates/kwe-scene-renderer",
    "crates/kwe-shader-compiler",
    "crates/kwe-test-renderer",
    "crates/kwe-video-renderer",
    "crates/kwe-vulkan",
    "crates/kwe-web-renderer",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/kde-wallpaper-engine/kde-wallpaper-engine"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
ash = "0.38"
cc = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
lz4_flex = "0.14"
memmap2 = "0.9"
rquickjs = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# S2: GLSL -> SPIR-V for the material-shader pipeline. Default features
# (no "build-from-source") link the SYSTEM libshaderc via pkg-config
# (verified against /usr/lib/pkgconfig/shaderc.pc, libshaderc_shared.so.1
# on this host) instead of vendoring/building glslang+shaderc from source.
# Packaging must add `shaderc` (runtime) and `shaderc` (pkg-config .pc +
# headers live in the same package on Arch) as a build dependency; see
# packaging/PKGBUILD.
shaderc = "0.10.1"
thiserror = "2.0"
