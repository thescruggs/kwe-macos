[package]
name = "kwe-scene-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Isolated KWE SceneScript renderer: QuickJS script engine plus an original offscreen Vulkan compositor"

[build-dependencies]
cc.workspace = true

[dependencies]
anyhow.workspace = true
ash.workspace = true
clap.workspace = true
kwe-core = { path = "../kwe-core" }
kwe-frame-protocol = { path = "../kwe-frame-protocol" }
kwe-input-protocol = { path = "../kwe-input-protocol" }
kwe-mpv = { path = "../kwe-mpv" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
libc.workspace = true
rquickjs.workspace = true
serde_json.workspace = true
texture2ddecoder = "0.1.2"
lz4_flex.workspace = true
