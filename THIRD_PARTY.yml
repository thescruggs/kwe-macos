  - id: chromium
    project: The Chromium Project (headless Chromium)
    url: https://www.chromium.org/
    revision: 151.0.7922.137 (installed package 151.0.7922.137-1.1 on the development machine)
    license_observed: BSD-3-Clause
    use: separate-process-backend
    approved_for_code_use: true
    notes: kwe-web-renderer spawns one headless Chromium per web wallpaper inside a bwrap sandbox (crates/kwe-core/src/websandbox.rs) and drives it exclusively over a DevTools pipe (CDP screencast -> BGRA frames); no upstream code is copied and chromium is never linked, only exec'd. The V8 sandbox reserves ~53 GiB of virtual address space per process, which is why the daemon's web-kind RLIMIT_AS default is 128 GiB (docs/BETA_M2.md M2b open risks). Revision pinned to the installed package; flag/behavior shapes verified empirically on 151.

  - id: bubblewrap
    project: bubblewrap (bwrap)
    url: https://github.com/containers/bubblewrap
    revision: 0.11.2-1.1 (installed package on the development machine)
    license_observed: LGPL-2.0-or-later
    use: separate-process-backend
    approved_for_code_use: true
    notes: kwe-web-renderer execs bwrap to build the read-only rootfs and user namespaces for the sandboxed chromium (crates/kwe-core/src/websandbox.rs); never linked, no upstream code copied. Spawning the bwrap fork is what RLIMIT_NPROC governs, hence the web kind's 32768 process ceiling (docs/BETA_M2.md M2b). Revision pinned to the installed package.

  - id: rust-image
    project: image
    url: https://crates.io/crates/image
    revision: 0.25.10
    license_observed: MIT OR Apache-2.0
    use: dependency
    approved_for_code_use: true
    notes: Two consumers. (1) M2a: decodes the BGRA frames the web renderer publishes from chromium CDP screencast events. (2) M3c: bounded PNG/JPEG/WebP decoding for SceneScript image layers (crates/kwe-scene-renderer/src/textures.rs) — default-features off, only the png/jpeg/webp features enabled; decoded RGBA8 is uploaded as R8G8B8A8_UNORM (identity). Bounds: dimension 8192, pixel count 16_777_216, source and decoded allocation 64 MiB each, 256 MiB total across layers. Used only by the separate-process web/scene workers; never in plasmashell. Exact transitive set pinned in Cargo.lock.

  - id: quickjs-rquickjs
    project: QuickJS JavaScript engine via rquickjs (rquickjs/rquickjs-sys)
    url: https://crates.io/crates/rquickjs
    revision: 0.12.2 (rquickjs 0.12.2; rquickjs-sys 0.12.2 vendored quickjs-ng 0.15.1 — QJS_VERSION 0.15.1 in vendored quickjs/quickjs.h, license MIT per upstream)
    license_observed: MIT
    use: dependency
    approved_for_code_use: true
    notes: JS engine for the original SceneScript implementation (ADR 0001; docs/SCENE_FORMAT_V1.md). Used only by the separate-process kwe-scene-renderer worker; never in plasmashell. Bounded execution is enforced with Runtime::set_memory_limit (64 MiB heap) and set_interrupt_handler (per-update wall-clock soft/hard budget, M3a) — no WE code is copied or linked; the engine just evaluates the wallpaper's script. Exact transitive set pinned in Cargo.lock (rquickjs-core, rquickjs-sys, cc build of vendored QuickJS C).

  - id: stb-truetype
    project: stb_truetype (nothings/stb single-file library)
    url: https://github.com/nothings/stb
    revision: vendored header at commit 6e9f34d5429cf16790ec43c9bac3f1ee4ad1f760 (2024-12-08); redox-os/stb_truetype crate 0.3.1 researched but NOT used (its surface is C API re-exports only — it has no pixel rasterizer of its own, so it was dropped in favor of the vendored header)
    license_observed: public domain (stb_truetype.h license header: "This library is in the public domain"); crate MIT OR Apache-2.0 (research only)
    use: vendored-source
    approved_for_code_use: true
    notes: M3e text-layer glyph rasterization (crates/kwe-scene-renderer/vendor/stb/stb_truetype.h, unmodified, STB_TRUETYPE_IMPLEMENTATION compiled once in the original C shim vendor/stb/stb_shim.c via a cc build.rs; never linked into plasmashell — separate-process kwe-scene-renderer worker only). The shim bounds everything the Rust side sees: ttc collection offset lookup, GetGlyphBitmapBoxSubpixel (no subpixel shift), shape vertex count capped at 65536 before rasterization, flatness 0.35. Public domain per upstream license header; vendored file is bit-exact with the pinned upstream commit. One ledger entry covers the vendored header and the researched-but-unused crate.
