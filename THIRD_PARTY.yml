    url: https://crates.io/crates/mpv
    revision: 0.2.3
    license_observed: MIT OR Apache-2.0
    use: dependency
    approved_for_code_use: true
    notes: Safe Rust wrapper around libmpv in kwe-video-renderer, used for the client API-version diagnostic; its builder initializes the mpv core before exposing the handle, which libmpv 0.41 forbids with a render context (aborts), so the render API itself is bound directly (docs/BETA_M1.md).

