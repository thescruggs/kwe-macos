  - id: almamu-linux-wallpaperengine
    project: Almamu/linux-wallpaperengine
    url: https://github.com/Almamu/linux-wallpaperengine
    revision: b016d7d1fdcf4e5fd2f9c9fa420a8aaa07fee02d
    license_observed: GPL-3.0-only (check upstream LICENSE)
    use: adapted
    approved_for_code_use: true
    notes: >
      relicensed project to GPL-3.0-or-later 2026-08-22; scene renderer work
      adapts this project. S1 (scene port, texture container + model/material
      resolution) adapted files, each carrying a Borrowed-From comment at the
      adapted function/struct:
      src/WallpaperEngine/Data/Parsers/TextureParser.cpp (container/header/
      mipmap/frame-table parsing, format enum) -> crates/kwe-scene-renderer/src/texv.rs;
      src/WallpaperEngine/Data/Assets/Texture.h (format/flags/container-version
      enums, Mipmap/Frame/Texture field shapes) -> crates/kwe-scene-renderer/src/texv.rs;
      src/WallpaperEngine/Render/CTexture.cpp (raw-format-to-GL upload rule:
      which formats decode via stb_image vs. raw/BC upload, and ARGB8888's
      untransformed R,G,B,A byte order) -> crates/kwe-scene-renderer/src/texv.rs
      (re-expressed as a CPU RGBA8 expansion; upstream hands bytes to OpenGL
      unchanged, this decoder produces pixels instead);
      src/WallpaperEngine/Data/Parsers/ModelParser.cpp (image -> model.json ->
      material path walk) -> crates/kwe-core/src/scenemodel.rs;
      src/WallpaperEngine/Data/Parsers/MaterialParser.cpp (material.json ->
      passes[0] -> texture-slot walk) -> crates/kwe-core/src/scenemodel.rs;
      src/WallpaperEngine/Data/Model/Material.h (MaterialPass/Material field
      shapes) -> crates/kwe-core/src/scenemodel.rs;
      src/WallpaperEngine/Assets/AssetLocator.cpp (AssetLocator::texture's
      "materials/<name>.tex" naming rule) -> crates/kwe-core/src/scenemodel.rs.
      S2 (material shaders) adapted files, each carrying a Borrowed-From
      comment at the adapted function:
      src/WallpaperEngine/Render/Shaders/ShaderUnit.cpp (SHADER_HEADER/
      FRAGMENT_SHADER_DEFINES/VERTEX_SHADER_DEFINES HLSL-compat macro block,
      #include resolution and gl_FragColor rewrite, #require LightingV1
      stub, // [COMBO] and commented-uniform metadata scraping) ->
      crates/kwe-scene-renderer/src/shaderpre.rs (adapted: recursive bounded
      #include resolution replaces the two-pass one-level scheme; two
      Vulkan-only #extension pragmas and the fold_declarations pass —
      layout(location=)/layout(binding=)/MaterialUniforms UBO folding —
      have no upstream equivalent, since upstream targets OpenGL 330 via a
      SPIRV-Cross round trip rather than compiling straight to Vulkan
      SPIR-V);
      src/WallpaperEngine/Assets/AssetLocator.cpp (AssetLocator::shader's
      workshop/<id>/<file> -> zcompat/scene/shaders/<id>/<file> compat
      redirect) -> crates/kwe-scene-renderer/src/main.rs
      (resolve_shader_reference).
      Verified cross-checked against real Workshop payloads under
      /media/crushinator/steamapps/workshop/content/431960/*/ and the real
      Wallpaper Engine asset shaders under
      /media/crushinator/steamapps/common/wallpaper_engine/assets/shaders
      (never committed as fixtures; synthetic buffers/shader text only in
      tests).

  - id: rust-texture2ddecoder
    project: texture2ddecoder
    url: https://crates.io/crates/texture2ddecoder
    revision: 0.1.2
    license_observed: MIT OR Apache-2.0
    use: dependency
    approved_for_code_use: true
    notes: >
      Pure-Rust, no_std CPU block decoder for DXT1/DXT3/DXT5/BC7 (S1 TEXV
      texture decode, crates/kwe-scene-renderer/src/texv.rs). Used only by
      the separate-process kwe-scene-renderer worker, never in plasmashell.
      Its block decoders write packed u32 pixels as
      u32::from_le_bytes([b, g, r, a]) (BGRA in-memory byte order); texv.rs
      swaps R/B per pixel to produce this project's straight RGBA8
      convention before handing pixels to the compositor.

  - id: rust-shaderc
    project: shaderc (Rust bindings)
    url: https://crates.io/crates/shaderc
    revision: 0.10.1
    license_observed: Apache-2.0
    use: dependency
    approved_for_code_use: true
    notes: >
      GLSL -> SPIR-V compilation for the S2 material-shader pipeline
      (crates/kwe-scene-renderer/src/materialshader.rs). Built with DEFAULT
      crate features only (no "build-from-source") so the crate's build
      script links the SYSTEM libshaderc dynamically via pkg-config
      (verified against /usr/lib/pkgconfig/shaderc.pc and
      /usr/lib/libshaderc_shared.so.1 on the development machine) rather
      than vendoring/building glslang+spirv-tools from source. The system
      libshaderc itself (Apache-2.0, upstream
      https://github.com/google/shaderc, packaged as `shaderc` on Arch —
      the same package provides both the runtime .so and the pkg-config
      .pc/headers used at build time) is a separate, unbundled runtime
      dependency; packaging/PKGBUILD adds it under `depends`. Used only by
      the separate-process kwe-scene-renderer worker, never in plasmashell.

